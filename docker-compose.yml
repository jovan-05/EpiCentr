services:
  falkordb:
    image: falkordb/falkordb:latest
    container_name: keystone-falkordb
    ports:
      - "6379:6379"   # database (Redis protocol)
      - "3000:3000"   # FalkorDB Browser UI
    volumes:
      - falkordb_data:/var/lib/falkordb/data   # persists graphs across restarts
    restart: unless-stopped

volumes:
  falkordb_data:
